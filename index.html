<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Windows Secure Decoder</title>

<style>
body {
    background: black;
    color: #00ff88;
    font-family: monospace;
    text-align: center;
    padding-top: 50px;
}

.box {
    border: 1px solid #00ff88;
    padding: 20px;
    width: 350px;
    margin: auto;
}

input {
    width: 90%;
    padding: 10px;
    margin: 5px;
    background: black;
    border: 1px solid #00ff88;
    color: #00ff88;
}

button {
    padding: 10px;
    margin-top: 10px;
    background: #00ff88;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

h1 {
    color: #00ff88;
}
</style>
</head>

<body>

<h1>WINDOWS SECURITY CORE</h1>

<div class="box">
    <h3>Jelszó → Kód</h3>
    <input id="pass" placeholder="Írd be a jelszót">
    <button onclick="encode()">Kódosítás</button>
    <div id="out1"></div>
</div>

<br>

<div class="box">
    <h3>Kód → Jelszó</h3>
    <input id="code" placeholder="Írd be a kódot">
    <button onclick="decode()">Dekódolás</button>
    <div id="out2"></div>
</div>

<script>

// Jelszó -> kód
function encode() {
    let pass = document.getElementById("pass").value;
    let encoded = btoa(pass);
    document.getElementById("out1").innerHTML =
        "KÓD: " + encoded;
}

// Kód -> jelszó
function decode() {
    let code = document.getElementById("code").value;

    try {
        let decoded = atob(code);
        document.getElementById("out2").innerHTML =
            "JELSZÓ: " + decoded;
    } catch(e) {
        document.getElementById("out2").innerHTML =
            "Hibás kód!";
    }
}

</script>

</body>
</html>
