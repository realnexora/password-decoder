<!DOCTYPE html>
<html>
<head>
  <title>Secret Decoder</title>
</head>
<body>

<h2>Titkos kód dekóder</h2>

<p>Írd be a kódot:</p>
<input id="input" placeholder="pl. R29yYW4yMDEx">
<button onclick="decode()">Dekódolás</button>

<p>Eredmény:</p>
<div id="output"></div>

<script>
function decode() {
    let encoded = document.getElementById("input").value;
    let decoded = atob(encoded); // base64 decode
    document.getElementById("output").innerText = decoded;
}
</script>

</body>
</html>
